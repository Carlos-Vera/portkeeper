<!doctype html>
<!-- Capture page for the README screenshots: the app (src/ + mock data) on a wallpaper.
     Used by assets/screenshots.sh; query: ?shot=active|expanded|closed|settings&theme=dark|light -->
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { --pad: 40px; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { display: flex; justify-content: center; padding-top: var(--pad); box-sizing: border-box;
    background: #1a2040;
    background-image:
      radial-gradient(55% 45% at 15% 15%, #4f6bd8 0%, transparent 70%),
      radial-gradient(50% 50% at 90% 30%, #8b5cc4 0%, transparent 70%),
      radial-gradient(60% 50% at 40% 100%, #1f8a8a 0%, transparent 70%); }
  body.light { background: #e9edf5;
    background-image:
      radial-gradient(55% 45% at 15% 15%, #b9c8ff 0%, transparent 70%),
      radial-gradient(50% 50% at 90% 30%, #e2c8ff 0%, transparent 70%),
      radial-gradient(60% 50% at 40% 100%, #b8ecdc 0%, transparent 70%); }
  .glass { position: relative; width: 290px; height: var(--h, 300px); border-radius: 14px; overflow: hidden;
    background: rgba(18, 20, 30, .55); backdrop-filter: blur(28px) saturate(170%);
    box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .25), inset 0 1px 0 rgba(255, 255, 255, .12), 0 24px 50px rgba(0, 0, 0, .4), 0 2px 8px rgba(0, 0, 0, .2); }
  body.light .glass { background: rgba(255, 255, 255, .45);
    box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .12), 0 24px 50px rgba(40, 50, 90, .22), 0 2px 8px rgba(40, 50, 90, .12); }
  iframe { position: absolute; inset: 0; width: 290px; height: 100%; border: 0; background: transparent; }
</style>
</head>
<body>
<div class="glass" id="g"><iframe id="f"></iframe></div>
<script>
  const q = new URLSearchParams(location.search);
  const theme = q.get("theme") || "dark";
  if (theme === "light") document.body.classList.add("light");
  document.getElementById("f").src = `../src/index.html?embed&shot=${q.get("shot") || "active"}&theme=${theme}`;
  addEventListener("message", (e) => {
    if (e.data && e.data.portkeeper === "height") {
      document.getElementById("g").style.setProperty("--h", e.data.value + "px");
      document.title = "h:" + e.data.value; // read by screenshots.sh to size the window
    }
  });
</script>
</body>
</html>
