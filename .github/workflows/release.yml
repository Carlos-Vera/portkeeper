name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the app only installs updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS: ad-hoc sign the whole bundle. Without it the app ships with only the
          # linker's signature and Gatekeeper reports it as "damaged" instead of offering
          # "Open Anyway". Replace with a Developer ID identity once there is one.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Portkeeper ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform below. The builds have no Apple or Microsoft developer certificate yet, so your system warns once: macOS → System Settings → Privacy & Security → Open Anyway; Windows → More info → Run anyway. Details in the README."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          # latest.json, read by the in-app updater; Windows updates through the .exe installer.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  # Copies of the main installers with version-free names, so
  # releases/latest/download/<name> always points at the newest build (README, website).
  stable-names:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Upload version-free copies
        run: |
          mkdir dl && cd dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            -p '*_aarch64.dmg' -p '*_x64.dmg' -p '*_x64-setup.exe' -p '*_amd64.AppImage'
          mv *_aarch64.dmg Portkeeper-macOS-AppleSilicon.dmg
          mv *_x64.dmg Portkeeper-macOS-Intel.dmg
          mv *_x64-setup.exe Portkeeper-Windows-x64-setup.exe
          mv *_amd64.AppImage Portkeeper-Linux-x86_64.AppImage
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber Portkeeper-*
