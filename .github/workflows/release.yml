name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Same checks as ci.yml; a tag only ships if they pass.
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    needs: test
    # Holds the signing key: add yourself as required reviewer in Settings -> Environments -> release.
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the app only installs updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS: ad-hoc sign the whole bundle. Without it the app ships with only the
          # linker's signature and Gatekeeper reports it as "damaged" instead of offering
          # "Open Anyway". Replace with a Developer ID identity once there is one.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Portkeeper ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform below. The builds have no Apple or Microsoft developer certificate yet, so your system warns once: macOS → System Settings → Privacy & Security → Open Anyway; Windows → More info → Run anyway. Details in the README."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          # latest.json, read by the in-app updater; Windows updates through the .exe installer.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  # Copies of the main installers with version-free names, so
  # releases/latest/download/<name> always points at the newest build (README, website).
  stable-names:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Upload version-free copies
        run: |
          mkdir dl && cd dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            -p '*_aarch64.dmg' -p '*_x64.dmg' -p '*_x64-setup.exe' -p '*_amd64.AppImage'
          mv *_aarch64.dmg Portkeeper-macOS-AppleSilicon.dmg
          mv *_x64.dmg Portkeeper-macOS-Intel.dmg
          mv *_x64-setup.exe Portkeeper-Windows-x64-setup.exe
          mv *_amd64.AppImage Portkeeper-Linux-x86_64.AppImage
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber Portkeeper-*
