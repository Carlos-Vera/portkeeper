[package]
name = "portkeeper"
version = "0.5.0"
description = "Open ports and Docker containers at a glance, from your tray"
authors = ["Marc Aparisi Rull"]
license = "MIT"
repository = "https://github.com/MarcAparisiTFG/portkeeper"
edition = "2021"
rust-version = "1.77"

[lib]
name = "portkeeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
listeners = "0.2"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
tauri-nspanel = "2.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSResponder", "NSAnimationContext", "NSView", "NSGlassEffectView", "NSGraphics", "NSColor", "NSScreen"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSArray"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
